<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THAC Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        thac: { navy: '#0f172a', blue: '#2563EB', bg: '#f8fafc' }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
        
        /* Barra de progreso circular para fechas */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-thac-bg text-slate-800 h-screen flex flex-col overflow-hidden selection:bg-blue-200">

    <main id="app-content" class="flex-1 overflow-y-auto no-scrollbar p-6 pb-28">
        
        <div id="page-home" class="page active">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Hola, Opositora 👋</h1>
                    <p id="date-display" class="text-slate-500 text-sm font-medium">Cargando fecha...</p>
                </div>
                <button onclick="openSettings()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-slate-200 text-slate-400 hover:text-blue-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>

            <div class="relative bg-slate-900 rounded-3xl p-6 text-white shadow-xl shadow-slate-200 mb-8 overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10"><svg class="w-24 h-24" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 00-.566-.241l-1.427-.357a1.017 1.017 0 00-.592.056l-3.375 1.688a1 1 0 01-1.378-.492l-1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L8 4.323V3a1 1 0 011-1zm-5 8.274l-.818 2.552a1 1 0 01-.138.293 2.016 2.016 0 01-1.015.683c.516.386 1.15.598 1.812.598a2.982 2.982 0 002.322-1.122 2.983 2.983 0 00.187-.215l-2.35-4.79z" clip-rule="evenodd"></path></svg></div>
                <p class="text-xs font-bold tracking-[0.2em] text-slate-400 mb-2 uppercase">Nivel Actual</p>
                <div class="flex items-baseline gap-2 mb-4">
                    <span id="coin-display" class="text-6xl font-black tracking-tighter">0</span>
                    <span class="text-lg font-medium text-slate-400">Días</span>
                </div>
                <span id="rank-badge" class="px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-bold border border-white/10 text-white">
                    Novata
                </span>
            </div>

            <h2 class="text-lg font-bold text-slate-800 mb-4 px-1">Acciones</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="navTo('study')" class="col-span-2 bg-blue-600 text-white p-6 rounded-2xl shadow-lg shadow-blue-200 flex items-center justify-between btn-press">
                    <div class="text-left">
                        <div class="text-blue-200 text-xs font-bold uppercase mb-1">Registro</div>
                        <div class="text-xl font-bold">Fichar Estudio</div>
                    </div>
                    <div class="bg-white/20 p-2 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></div>
                </button>
                
                <button onclick="navTo('wallet')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 btn-press h-32">
                    <span class="text-3xl">🎁</span>
                    <span class="font-bold text-slate-700 text-sm">Premios</span>
                </button>
                <button onclick="navTo('relax')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 btn-press h-32">
                    <span class="text-3xl">🧘‍♀️</span>
                    <span class="font-bold text-slate-700 text-sm">Relax</span>
                </button>
            </div>
        </div>

        <div id="page-dates" class="page">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Hitos 2026</h2>
            <p class="text-slate-500 mb-6">La meta está cada día más cerca.</p>
            
            <div id="countdown-container" class="space-y-4">
                </div>
        </div>

        <div id="page-study" class="page">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Fichar Día</h2>
            <div id="study-card" class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-100 mt-4">
                </div>
        </div>

        <div id="page-wallet" class="page">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Tus Recompensas</h2>
            <div id="wallet-list" class="space-y-4"></div>
        </div>

        <div id="page-relax" class="page">
            <h2 class="text-2xl font-bold text-slate-900 mb-4">Zona Zen</h2>
            
            <div class="bg-blue-50 rounded-2xl p-6 border border-blue-100 text-center mb-6">
                <h3 class="font-bold text-blue-900 mb-4">Respiración 4-4-8</h3>
                <div id="breath-circle" class="w-32 h-32 rounded-full border-4 border-blue-200 mx-auto flex items-center justify-center mb-4 transition-all duration-1000">
                    <span id="breath-text" class="text-blue-600 font-bold text-xl">Start</span>
                </div>
                <button onclick="startBreathing()" class="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold btn-press">Iniciar</button>
            </div>

            <div class="bg-white rounded-2xl p-6 border border-slate-100">
                <h3 class="font-bold text-slate-700 mb-4">Audios</h3>
                <select id="audio-select" class="w-full p-3 bg-slate-50 rounded-lg mb-3 border border-slate-200">
                    <option value="morning">☀️ Motivación</option>
                    <option value="panic">🆘 Anti-Estrés</option>
                    <option value="love">❤️ Mensaje Especial</option>
                </select>
                <button onclick="playAudio()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold btn-press">Reproducir</button>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe pt-2 px-4 flex justify-between items-center z-50 h-[80px]">
        <button onclick="navTo('home')" class="nav-btn w-1/5 flex flex-col items-center gap-1 text-blue-600" data-target="home">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] font-bold">Inicio</span>
        </button>
        <button onclick="navTo('dates')" class="nav-btn w-1/5 flex flex-col items-center gap-1 text-slate-400" data-target="dates">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] font-bold">Fechas</span>
        </button>
        <button onclick="navTo('study')" class="nav-btn w-1/5 flex flex-col items-center gap-1 text-slate-400" data-target="study">
            <div class="bg-blue-600 text-white p-3 rounded-full -mt-6 shadow-lg shadow-blue-200 border-4 border-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </div>
        </button>
        <button onclick="navTo('wallet')" class="nav-btn w-1/5 flex flex-col items-center gap-1 text-slate-400" data-target="wallet">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] font-bold">Cartera</span>
        </button>
        <button onclick="navTo('relax')" class="nav-btn w-1/5 flex flex-col items-center gap-1 text-slate-400" data-target="relax">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] font-bold">Zen</span>
        </button>
    </nav>

    <script>
        const DATA_KEY = 'thac_app_v2';
        // FECHAS OBJETIVO
        const EXAMS = [
            { name: "1er Ejercicio", date: "2026-03-22", color: "blue" },
            { name: "2º Ejercicio", date: "2026-05-24", color: "indigo" },
            { name: "3er Ejercicio", date: "2026-07-05", color: "emerald" }
        ];

        let appData = { coins: 0, lastStudy: '', wallet: initialWallet() };

        function initialWallet() {
            return [
                {id: 1, title: "Cena Gourmet", active: true},
                {id: 2, title: "Masaje Espalda", active: true},
                {id: 3, title: "Cine VIP", active: true},
                {id: 4, title: "Escapada", active: true},
                {id: 5, title: "Vale Comodín", active: true}
            ];
        }

        function init() {
            const stored = localStorage.getItem(DATA_KEY);
            if(stored) appData = JSON.parse(stored);
            
            const opts = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date-display').textContent = new Date().toLocaleDateString('es-ES', opts);
            
            updateUI();
            renderCountdowns();
        }

        function save() {
            localStorage.setItem(DATA_KEY, JSON.stringify(appData));
            updateUI();
        }

        function updateUI() {
            document.getElementById('coin-display').textContent = appData.coins;
            
            // Rango
            let rank = "Novata";
            if(appData.coins >= 5) rank = "Constante";
            if(appData.coins >= 15) rank = "Experta";
            if(appData.coins >= 30) rank = "Inspectora";
            document.getElementById('rank-badge').textContent = rank;

            // Fichar UI
            const today = new Date().toISOString().split('T')[0];
            const hasStudied = appData.lastStudy === today;
            const studyDiv = document.getElementById('study-card');
            
            if(hasStudied) {
                studyDiv.innerHTML = `
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">🛡️</div>
                    <h3 class="font-bold text-lg text-green-800">Misión Cumplida</h3>
                    <p class="text-slate-500 text-sm">Ya has fichado hoy.</p>
                `;
            } else {
                studyDiv.innerHTML = `
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">📚</div>
                    <h3 class="font-bold text-lg mb-4">¿Día Productivo?</h3>
                    <button onclick="confirmStudy()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-200 btn-press">CONFIRMAR (+1)</button>
                `;
            }

            // Wallet UI
            const wList = document.getElementById('wallet-list');
            wList.innerHTML = '';
            appData.wallet.forEach(item => {
                const isUsed = !item.active;
                wList.innerHTML += `
                    <div class="bg-white p-4 rounded-xl border ${isUsed ? 'border-slate-100 bg-slate-50' : 'border-slate-100 shadow-sm'} flex justify-between items-center">
                        <div class="${isUsed ? 'opacity-50' : ''}">
                            <div class="font-bold text-slate-800 ${isUsed ? 'line-through' : ''}">${item.title}</div>
                            <div class="text-[10px] font-bold tracking-wider ${isUsed ? 'text-slate-400' : 'text-green-500'}">${isUsed ? 'USADO' : 'DISPONIBLE'}</div>
                        </div>
                        ${!isUsed ? `<button onclick="redeem(${item.id})" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold btn-press">Usar</button>` : ''}
                    </div>
                `;
            });
        }

        // --- COUNTDOWN LOGIC ---
        function renderCountdowns() {
            const container = document.getElementById('countdown-container');
            container.innerHTML = '';
            
            const today = new Date();
            
            EXAMS.forEach(exam => {
                const examDate = new Date(exam.date);
                const diff = examDate - today;
                const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                
                // Color mapping
                const colors = {
                    blue: "bg-blue-50 text-blue-700 border-blue-100",
                    indigo: "bg-indigo-50 text-indigo-700 border-indigo-100",
                    emerald: "bg-emerald-50 text-emerald-700 border-emerald-100"
                };
                
                const style = colors[exam.color];

                container.innerHTML += `
                    <div class="p-5 rounded-2xl border ${style} flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold uppercase opacity-70 mb-1">${exam.date}</div>
                            <div class="font-extrabold text-lg">${exam.name}</div>
                        </div>
                        <div class="text-center">
                            <span class="block text-3xl font-black">${daysLeft}</span>
                            <span class="text-[10px] font-bold uppercase">Días</span>
                        </div>
                    </div>
                `;
            });
        }

        // --- ACTIONS ---
        function confirmStudy() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            appData.coins++;
            appData.lastStudy = new Date().toISOString().split('T')[0];
            
            // Check Bonus (Cada 5 días)
            if(appData.coins % 5 === 0) {
                Swal.fire({
                    title: '¡BONUS!',
                    text: `Has llegado a ${appData.coins} días. ¡Tienes una recompensa especial!`,
                    icon: 'success',
                    confirmButtonText: 'Genial'
                });
            }
            save();
        }

        function redeem(id) {
            Swal.fire({
                title: '¿Canjear vale?',
                text: "No podrás deshacer esta acción.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, disfrutar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const item = appData.wallet.find(i => i.id === id);
                    if(item) {
                        item.active = false;
                        save();
                        confetti();
                        Swal.fire('¡Disfrutado!', 'Has canjeado tu regalo.', 'success');
                    }
                }
            });
        }

        function navTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+page).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-blue-600');
                b.classList.add('text-slate-400');
            });
            document.querySelector(`.nav-btn[data-target="${page}"]`).classList.add('text-blue-600');
            document.querySelector(`.nav-btn[data-target="${page}"]`).classList.remove('text-slate-400');
        }

        // --- SETTINGS & ADMIN ---
        function openSettings() {
            Swal.fire({
                title: 'Configuración',
                html: `
                    <div class="grid gap-3">
                        <button onclick="testReward()" class="bg-yellow-100 text-yellow-800 p-3 rounded-lg font-bold text-sm border border-yellow-200">🧪 Simular 5 Días (+Bonus)</button>
                        <button onclick="resetApp()" class="bg-red-100 text-red-800 p-3 rounded-lg font-bold text-sm border border-red-200">⚠️ Borrar Datos (Reset)</button>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        }

        function testReward() {
            appData.coins += 5; // Sumamos 5 de golpe
            save();
            Swal.close();
            // Disparar la alerta de bonus manualmente para probar
            setTimeout(() => {
                confetti();
                Swal.fire('¡PRUEBA DE BONUS!', `Has alcanzado ${appData.coins} días. (Simulación)`, 'success');
            }, 500);
        }

        function resetApp() {
            if(confirm("¿Seguro? Se borrará todo el progreso.")) {
                localStorage.removeItem(DATA_KEY);
                location.reload();
            }
        }
        
        // --- BREATHING & AUDIO ---
        function startBreathing() {
            const circle = document.getElementById('breath-circle');
            const text = document.getElementById('breath-text');
            
            text.innerText = "Inhala (4)";
            circle.classList.add('scale-125', 'border-blue-500');
            
            setTimeout(() => {
                text.innerText = "Mantén (4)";
                circle.classList.remove('border-blue-500');
                circle.classList.add('border-yellow-400');
                
                setTimeout(() => {
                    text.innerText = "Exhala (8)";
                    circle.classList.remove('scale-125', 'border-yellow-400');
                    circle.classList.add('scale-90', 'border-green-500');
                    
                    setTimeout(() => {
                        text.innerText = "Listo";
                        circle.classList.remove('scale-90', 'border-green-500');
                    }, 8000);
                }, 4000);
            }, 4000);
        }
        
        function playAudio() {
             const val = document.getElementById('audio-select').value;
             // Audio logic here
             Swal.fire({title: 'Reproduciendo...', text: `Archivo: ${val}.mp3`, timer: 2000, showConfirmButton: false});
        }

        init();
    </script>
</body>
</html>
